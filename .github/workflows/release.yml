name: Release

on:
    push:
        tags:
            - 'v*'

env:
    FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '24'
                  cache: 'npm'

            - name: Install dependencies
              run: |
                  if [ -f package-lock.json ]; then
                      npm ci --legacy-peer-deps
                  else
                      npm install --legacy-peer-deps
                  fi

            - name: Build assets
              run: npm run build

            - name: Package plugin
              run: npm run package

            - name: Publish GitHub Release
              uses: softprops/action-gh-release@v2
              with:
                  name: WP Telegram Post Notifier ${{ github.ref_name }}
                  body_path: CHANGELOG.md
                  files: dist/wp-telegram-post-notifier.zip
                  draft: false
                  prerelease: false
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
